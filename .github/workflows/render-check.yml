name: Verify Render server
on:
  push:
    branches: [main]
    paths: ['server/**', 'lib/**', 'scripts/scenario-job.ts', 'scripts/package-scenario.py', 'scripts/ksc-trust.sh', 'scripts/prepare-render.mjs', 'tests/**', 'Dockerfile.render', '.dockerignore', 'render.yaml', 'package*.json', '.github/workflows/render-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:scenario
      - name: Build production image
        run: docker build -f Dockerfile.render -t launch-replay .
      - name: Check the production HTTP server and complete ZIP
        run: |
          docker run -d --name replay-check -p 10000:10000 -v replay-test:/var/data -e RENDER=true -e RENDER_EXTERNAL_URL=http://localhost:10000 launch-replay
          trap 'docker logs replay-check; docker rm -f replay-check' EXIT
          curl --fail --max-time 5 --retry 10 --retry-delay 1 --retry-all-errors http://localhost:10000/api/health
          curl --fail http://localhost:10000/ -o /tmp/replay.html
          curl --fail http://localhost:10000/config.js
          curl --fail http://localhost:10000/network-test.zip -o /tmp/replay-test.zip
          python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/replay-test.zip'); assert z.testzip() is None; assert 'README.txt' in z.namelist()"
          docker exec replay-check node --import tsx --input-type=module -e "import { kscURL } from './lib/archive.ts'; const r = await fetch(kscURL('fieldmills', 0, '2024-06-25T21:00:00Z', '2024-06-25T21:01:00Z'), { signal: AbortSignal.timeout(60000) }); if (!r.ok || !(await r.text()).includes('OneMinuteMean')) throw Error('KSC probe failed'); console.log('KSC TLS and field-mill endpoint verified');"
