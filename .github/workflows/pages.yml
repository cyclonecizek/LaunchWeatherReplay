name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths: ['pages/**', 'scripts/build-pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Build GR scenario']
    branches: [main]
    types: [completed]

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Build the download catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-pages.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: outputs/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # First enable Settings > Pages > Source: GitHub Actions in the repository.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
